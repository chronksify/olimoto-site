<!--meta {"title":"Contact · oliMoto","description":"Get in touch with the oliMoto team.","slug":"contact"} -->
<section class="band">
  <div class="wrap split">
    <div>
      <h1>Get in touch</h1>
      <p class="lede" style="margin-top:22px">Questions, offers of help or press enquiries. For sponsorship, use the <a href="/sponsor#enquire">sponsor form</a>.</p>
      <p><a href="mailto:joe.purkis@mail.com">joe.purkis@mail.com</a></p>
    </div>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" data-ajax data-success="Thanks. We'll get back to you soon.">
      <input type="hidden" name="form-name" value="contact">
      <p hidden><label>Leave this empty <input name="bot-field"></label></p>
      <div class="field"><label for="c-name">Name</label><input id="c-name" type="text" name="name" required autocomplete="name"></div>
      <div class="field"><label for="c-email">Email</label><input id="c-email" type="email" name="email" required autocomplete="email"></div>
      <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" name="message" required></textarea></div>
      <button class="btn btn--hivis" type="submit">Send message</button>
      <p class="form-status" role="status"></p>
    </form>
  </div>
</section>
